source = ~/.config/hypr/hyprlock-colors.conf

$font = Flex Rounded
$card = rgba(1A1C18b3)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/sddm/themes/pixie/assets/background.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.4
}

# Date (top-left)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 17
    font_family = $font
    color = $accent

    position = 60, -50
    halign = left
    valign = top
}

# Card
shape {
    monitor =
    size = 380, 480
    color = $card
    rounding = 32

    position = 0, 0
    halign = center
    valign = center
}

# Avatar (120px circle)
image {
    monitor =
    path = /usr/share/sddm/themes/pixie/assets/avatar.jpg
    size = 120
    rounding = -1
    border_size = 0

    position = 0, 140
    halign = center
    valign = center
}

# Username (24px bold)
label {
    monitor =
    text = <b>$USER</b>
    font_size = 18
    font_family = $font
    color = rgb(FFFFFF)

    position = 0, 30
    halign = center
    valign = center
}

# Session pill
shape {
    monitor =
    size = 180, 36
    color = rgba(255, 255, 255, 0.08)
    rounding = 18
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)

    position = 0, -28
    halign = center
    valign = center
}
label {
    monitor =
    text = Hyprland
    font_size = 10
    font_family = $font
    color = rgb(FFFFFF)

    position = 0, -28
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 44
    rounding = 16
    outline_thickness = 2
    outer_color = $accent
    inner_color = $surface
    font_color = rgb(FFFFFF)
    check_color = $accent
    fail_color = $error
    fade_on_empty = false
    font_family = $font
    font_size = 13
    placeholder_text = <span foreground="##808080">Enter Password</span>
    fail_text = $PAMFAIL
    dots_center = true
    dots_spacing = 0.3

    position = 0, -111
    halign = center
    valign = center
}

# Round button (decorative: Enter submits)
shape {
    monitor =
    size = 64, 64
    color = $accent
    rounding = -1

    position = 0, -182
    halign = center
    valign = center
}
label {
    monitor =
    text = →
    font_size = 24
    font_family = $font
    color = rgb(1A1C18)

    position = 0, -182
    halign = center
    valign = center
}
