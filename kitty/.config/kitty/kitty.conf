# ================================================
# Font
# ================================================
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size        13.0
 
# Ligatures
font_features JetBrainsMonoNFM-Regular +liga +calt
font_features JetBrainsMonoNFM-Bold    +liga +calt
 
# ================================================
# Cursor
# ================================================
cursor_shape          block
cursor_blink_interval 0
# cursor_shape beam   # uncomment if you prefer a beam cursor
 
# ================================================
# Scrollback
# ================================================
scrollback_lines 10000
 
# ================================================
# Mouse
# ================================================
mouse_hide_wait 3.0
copy_on_select  no
 
# ================================================
# Window
# ================================================
window_padding_width    8
placement_strategy      center
hide_window_decorations no
 
remember_window_size  yes
initial_window_width  1200
initial_window_height 700

background_opacity 0.9
 
# ================================================
# Tabs
# ================================================
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     2
tab_title_template   "{index}: {title}"
 
active_tab_font_style   bold
inactive_tab_font_style normal
 
# ================================================
# Color scheme — Catppuccin Mocha
# Pairs well with catppuccin-powerline starship preset
# ================================================
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5C2E7
 
cursor                  #F5C2E7
cursor_text_color       #1E1E2E
 
url_color               #F5C2E7
 
# Black
color0  #45475A
color8  #585B70
 
# Red
color1  #F38BA8
color9  #F38BA8
 
# Green
color2  #A6E3A1
color10 #A6E3A1
 
# Yellow
color3  #F9E2AF
color11 #F9E2AF
 
# Blue
color4  #89B4FA
color12 #89B4FA
 
# Magenta
color5  #F5C2E7
color13 #F5C2E7
 
# Cyan
color6  #94E2D5
color14 #94E2D5
 
# White
color7  #BAC2DE
color15 #A6ADC8
 
# ================================================
# Performance
# ================================================
repaint_delay    8
input_delay      2
sync_to_monitor  yes
 
# ================================================
# Bell
# ================================================
enable_audio_bell no
visual_bell_duration 0.0
 
# ================================================
# Keyboard shortcuts
# ================================================
# Clear all defaults and define only what we need
clear_all_shortcuts no
 
# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
 
# Scrollback
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end  scroll_end
 
# Font size
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0
 
# Tabs
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
 
# Windows (splits)
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window
 
# ================================================
# Shell integration
# ================================================
shell_integration enabled
